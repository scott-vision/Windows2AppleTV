[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pycast"
version = "0.1.0"
description = "Windows display and system-audio capture foundations for Apple TV mirroring"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12,<3.14"
dependencies = [
    "av>=12",
    "cryptography>=42",
    "dxcam[winrt]>=0.0.5; sys_platform == 'win32'",
    "keyring>=25",
    "numpy>=2",
    "platformdirs>=4",
    "pydantic>=2",
    "PyAudioWPatch>=0.2.12; sys_platform == 'win32'",
    "pynacl>=1.5",
    "rich>=13",
    "srptools>=1.0.1",
    "typer>=0.12",
    "zeroconf>=0.132",
]

[project.scripts]
pycast = "pycast.app.cli:app"

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pytest>=8",
    "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/pycast"]

[tool.ruff]
target-version = "py312"
line-length = 300
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
